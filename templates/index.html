<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>ERIIC + ANURAG MISHRA V7 TOKEN GENERATOR</title>
<style>
    :root{
        --neon:#00b894;
        --neon2:#7b2ff7;
        --neon3:#ff2d95;
        --bg:#f4f6fb;
        --card:#ffffff;
        --text:#1a1a2e;
        --muted:#6b7280;
        --err:#e11d48;
        --warn:#d97706;
        --ok:#16a34a;
        --line:#e5e7eb;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        background:
            radial-gradient(circle at 12% 8%, rgba(0,184,148,.12), transparent 45%),
            radial-gradient(circle at 88% 92%, rgba(123,47,247,.12), transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(255,45,149,.06), transparent 60%),
            var(--bg);
        background-attachment:fixed;
        color:var(--text);
        margin:0;
        min-height:100dvh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:16px;
        overflow-x:hidden;
        position:relative;
    }
    .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:0;pointer-events:none;}
    .orb1{width:260px;height:260px;background:#a7f3d0;top:-90px;left:-90px;animation:float1 11s ease-in-out infinite;}
    .orb2{width:300px;height:300px;background:#ddd6fe;bottom:-110px;right:-110px;animation:float2 13s ease-in-out infinite;}
    .orb3{width:200px;height:200px;background:#fbcfe8;top:45%;left:-120px;opacity:.35;animation:float1 15s ease-in-out infinite reverse;}
    @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(35px,-30px) scale(1.12);}}
    @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,25px) scale(1.1);}}

    .container{
        position:relative;z-index:2;width:100%;max-width:430px;
        background:rgba(255,255,255,.92);
        backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
        border-radius:24px;border:1px solid rgba(0,184,148,.25);
        box-shadow:0 0 0 1px rgba(0,0,0,.02),0 20px 60px rgba(30,30,60,.12),0 0 60px rgba(0,184,148,.08);
        padding:28px 22px 22px;text-align:center;overflow:hidden;
        animation:cardIn .8s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.94);}to{opacity:1;transform:none;}}
    .container::before{
        content:"";position:absolute;inset:0;border-radius:24px;padding:1.5px;
        background:linear-gradient(120deg,transparent 15%,var(--neon) 30%,transparent 45%,var(--neon2) 60%,transparent 75%,var(--neon3) 90%,transparent);
        background-size:300% 300%;
        -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
        -webkit-mask-composite:xor;mask-composite:exclude;
        animation:borderFlow 7s linear infinite;pointer-events:none;
    }
    @keyframes borderFlow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
    .container::after{
        content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
        width:60%;height:3px;
        background:linear-gradient(90deg,transparent,var(--neon),var(--neon2),transparent);
        border-radius:0 0 10px 10px;animation:topGlow 3s ease-in-out infinite;
    }
    @keyframes topGlow{0%,100%{opacity:.6;width:50%;}50%{opacity:1;width:75%;}}

    .brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px;}
    .logo-badge{
        display:inline-flex;align-items:center;gap:8px;
        padding:6px 14px;border-radius:50px;
        background:rgba(0,184,148,.1);border:1px solid rgba(0,184,148,.35);
        font-size:.62rem;letter-spacing:3px;color:var(--neon);font-weight:700;
        animation:badgePulse 2.5s ease-in-out infinite;
    }
    .logo-badge .dot{
        width:6px;height:6px;border-radius:50%;background:var(--neon);
        box-shadow:0 0 8px var(--neon);animation:dotBlink 1.2s ease-in-out infinite;
    }
    @keyframes dotBlink{0%,100%{opacity:1;}50%{opacity:.3;}}
    @keyframes badgePulse{0%,100%{box-shadow:0 0 15px rgba(0,184,148,.15);}50%{box-shadow:0 0 30px rgba(0,184,148,.35);}}
    h1{
        margin:0;font-size:1.35rem;font-weight:900;letter-spacing:1.2px;line-height:1.25;
        background:linear-gradient(120deg,#1a1a2e 20%,var(--neon) 45%,#1a1a2e 55%,var(--neon2) 80%,#1a1a2e);
        background-size:250% auto;-webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;animation:textShine 5s linear infinite;
    }
    @keyframes textShine{0%{background-position:0% center;}100%{background-position:250% center;}}
    h1 .amp{color:var(--neon3);-webkit-text-fill-color:var(--neon3);}
    h1 .v7{
        display:inline-block;font-size:.65rem;letter-spacing:1px;
        background:linear-gradient(135deg,var(--neon3),var(--neon2));
        color:#fff;-webkit-text-fill-color:#fff;padding:2px 8px;border-radius:6px;
        vertical-align:middle;margin-left:4px;
        box-shadow:0 4px 14px rgba(255,45,149,.4);animation:v7pop 2s ease-in-out infinite;
    }
    @keyframes v7pop{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
    .subtitle{font-size:.62rem;letter-spacing:4px;color:var(--muted);margin-top:2px;font-weight:600;}
    .subtitle b{color:var(--neon);}

    .input-group{margin-bottom:14px;text-align:left;animation:fadeUp .6s both;}
    .input-group:nth-child(2){animation-delay:.08s;}
    .input-wrap{position:relative;}
    .input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.55;transition:.25s;pointer-events:none;}
    label{display:block;margin-bottom:6px;color:#4b5563;font-size:.75rem;letter-spacing:.6px;font-weight:600;}
    input{
        width:100%;padding:13px 14px 13px 40px;border-radius:12px;
        border:1.5px solid var(--line);background:#f9fafb;color:var(--text);
        font-size:.95rem;outline:none;transition:.28s;font-family:inherit;letter-spacing:.3px;
    }
    input:focus{border-color:var(--neon);background:#fff;box-shadow:0 0 0 3px rgba(0,184,148,.13),0 4px 18px rgba(0,184,148,.1);}
    .input-wrap:focus-within .icon{opacity:1;filter:drop-shadow(0 0 4px var(--neon));}
    input::placeholder{color:#9ca3af;font-size:.88rem;}

    .main-btn{
        width:100%;padding:15px;border:none;border-radius:13px;
        background:linear-gradient(135deg,var(--neon) 0%, #00ceaa 60%, var(--neon2) 140%);
        background-size:200% auto;color:#fff;font-weight:900;font-size:.92rem;
        letter-spacing:1.5px;cursor:pointer;margin-top:8px;position:relative;overflow:hidden;
        transition:.3s;font-family:inherit;box-shadow:0 6px 20px rgba(0,184,148,.35);
    }
    .main-btn:hover{transform:translateY(-2px);background-position:right center;box-shadow:0 10px 30px rgba(0,184,148,.5);}
    .main-btn:active{transform:scale(.97);}
    .main-btn::after{
        content:"";position:absolute;top:0;left:-130%;width:55%;height:100%;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
        transform:skewX(-22deg);animation:shine 3.4s infinite;
    }
    @keyframes shine{0%{left:-130%;}55%{left:140%;}100%{left:140%;}}
    .main-btn:disabled{opacity:.75;cursor:wait;transform:none;}

    #message{margin-top:14px;font-size:.85rem;min-height:1.2em;transition:.3s;}
    .hidden{display:none !important;}
    .spinner{
        display:inline-block;width:15px;height:15px;
        border:2px solid rgba(0,0,0,.15);border-top-color:var(--neon);
        border-radius:50%;animation:spin .7s linear infinite;
        vertical-align:middle;margin-right:8px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    .error-block{
        margin-top:14px;padding:14px 16px;border-radius:13px;
        background:rgba(225,29,72,.06);border:1px solid rgba(225,29,72,.35);
        color:var(--err);font-size:.85rem;text-align:left;
        display:flex;align-items:flex-start;gap:10px;
        animation:errIn .55s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes errIn{0%{opacity:0;transform:scale(.85) translateY(12px);}50%{transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}
    .error-block .x{
        flex-shrink:0;width:26px;height:26px;line-height:26px;text-align:center;
        border-radius:50%;background:var(--err);color:#fff;font-weight:900;font-size:.85rem;
        animation:pulseX 1s infinite;
    }
    @keyframes pulseX{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
    .error-code{
        display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;
        background:rgba(225,29,72,.1);font-size:.7rem;font-weight:700;
        letter-spacing:1px;font-family:'Courier New',monospace;
    }

    .result-wrap{animation:fadeUp .6s both;}
    .result-title{
        color:var(--ok);font-weight:900;letter-spacing:2.5px;font-size:.95rem;
        display:flex;align-items:center;justify-content:center;gap:8px;
        animation:popIn .65s cubic-bezier(.2,.9,.3,1.4) both;
    }
    @keyframes popIn{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
    .result-title .check{
        display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;
        border-radius:50%;background:var(--ok);color:#fff;font-weight:900;font-size:.85rem;
        box-shadow:0 0 18px rgba(22,163,74,.5);animation:checkBounce 1s ease infinite;
    }
    @keyframes checkBounce{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

    .token-box{
        margin-top:14px;background:#f0fdf9;padding:16px 14px;border-radius:13px;
        word-break:break-all;font-family:'Courier New',monospace;font-size:.78rem;
        border:1.5px dashed var(--neon);color:#047857;
        position:relative;overflow:hidden;text-align:left;line-height:1.5;font-weight:600;
        animation:tokenReveal .9s cubic-bezier(.2,.9,.3,1.3) both;
        box-shadow:inset 0 0 20px rgba(0,184,148,.06);
    }
    @keyframes tokenReveal{
        0%{opacity:0;transform:scale(.7) rotateX(45deg);filter:blur(8px);}
        60%{opacity:1;transform:scale(1.04);}
        100%{opacity:1;transform:scale(1) rotateX(0);filter:blur(0);}
    }
    .token-box::after{
        content:"";position:absolute;inset:0;border-radius:13px;
        background:linear-gradient(90deg,transparent,rgba(0,184,148,.25),transparent);
        background-size:200% 100%;animation:scan 2.4s linear infinite;pointer-events:none;
    }
    @keyframes scan{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

    .copy-btn{
        margin-top:10px;padding:11px;font-size:.78rem;letter-spacing:1.5px;
        background:#fff;border:1.5px solid var(--neon);color:var(--neon);
        font-weight:700;border-radius:11px;cursor:pointer;width:100%;transition:.28s;font-family:inherit;
    }
    .copy-btn:hover{background:rgba(0,184,148,.08);box-shadow:0 4px 16px rgba(0,184,148,.2);}
    .copy-btn:active{transform:scale(.97);}

    .warn-badge{
        color:var(--warn);font-size:.8rem;letter-spacing:1.5px;font-weight:700;
        display:inline-flex;align-items:center;gap:8px;
        padding:6px 14px;border-radius:50px;
        background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.3);
        margin-bottom:14px;animation:warnBlink 1.4s ease-in-out infinite;
    }
    @keyframes warnBlink{0%,100%{opacity:1;}50%{opacity:.6;}}
    #otp{text-align:center;letter-spacing:10px;font-size:1.2rem;font-weight:900;padding-left:14px;color:var(--neon);}

    .footer-note{
        margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
        font-size:.62rem;color:var(--muted);letter-spacing:1.5px;
    }
    .footer-note b{color:var(--neon);}

    .wa-btn{
        position:fixed;bottom:20px;right:20px;z-index:50;
        display:flex;align-items:center;gap:9px;
        padding:12px 18px;border-radius:50px;
        background:linear-gradient(135deg,#25d366,#128c7e);
        color:#fff;font-weight:800;font-size:.82rem;text-decoration:none;
        box-shadow:0 8px 28px rgba(37,211,102,.45);
        transition:.3s;animation:waBob 3s ease-in-out infinite;border:2px solid #fff;
    }
    .wa-btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 38px rgba(37,211,102,.65);}
    @keyframes waBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
    .wa-btn svg{width:20px;height:20px;fill:#fff;flex-shrink:0;}
    .wa-btn::before{
        content:"";position:absolute;inset:-4px;border-radius:50px;
        border:2px solid rgba(37,211,102,.4);animation:waRing 2s ease-out infinite;
    }
    @keyframes waRing{0%{transform:scale(1);opacity:.8;}100%{transform:scale(1.15);opacity:0;}}

    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

    @media (max-width: 600px){
        body{padding:0;align-items:stretch;}
        .container{
            max-width:100%;width:100%;min-height:100dvh;border-radius:0;
            border-left:none;border-right:none;border-top:none;border-bottom:none;
            padding:max(28px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
            display:flex;flex-direction:column;justify-content:center;
            background:linear-gradient(170deg, #ffffff, #f7f9fc);
            animation:mobileIn .7s cubic-bezier(.2,.9,.3,1.2) both;
        }
        @keyframes mobileIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:none;}}
        .container::before{border-radius:0;}
        h1{font-size:1.5rem;}
        .wa-btn{bottom:max(16px, env(safe-area-inset-bottom));right:16px;padding:11px 16px;}
    }
    @media (min-width: 601px){.container{max-width:430px;}}
    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    }
</style>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="container">
        <div class="brand">
            <span class="logo-badge"><span class="dot"></span> SECURE ACCESS</span>
            <h1>ERIIC <span class="amp">+</span> ANURAG MISHRA <span class="v7">V7</span><br>TOKEN GENERATOR</h1>
            <span class="subtitle">FORCE 2FA • <b>PREMIUM</b></span>
        </div>

        <div id="login-form">
            <div class="input-group">
                <label>Email / User ID</label>
                <div class="input-wrap">
                    <input type="text" id="uid" placeholder="Enter Email or ID" autocomplete="username">
                    <span class="icon">👤</span>
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password">
                    <span class="icon">🔒</span>
                </div>
            </div>
            <button id="login-btn" class="main-btn" onclick="handleLogin()">⚡ GET TOKEN</button>
        </div>

        <div id="2fa-form" class="hidden">
            <div class="warn-badge">🔐 2FA DETECTED</div>
            <div class="input-group">
                <label>Enter OTP Code</label>
                <div class="input-wrap">
                    <input type="text" id="otp" placeholder="••••••" maxlength="6" inputmode="numeric">
                    <span class="icon">🔑</span>
                </div>
            </div>
            <button id="otp-btn" class="main-btn" onclick="handle2FA()">✅ VERIFY CODE</button>
        </div>

        <div id="message"></div>

        <div id="result" class="hidden result-wrap">
            <p class="result-title"><span class="check">✓</span> LOGIN SUCCESSFUL</p>
            <div class="token-box" id="token-display"></div>
            <button class="copy-btn" onclick="copyToken(event)">📋 COPY TOKEN</button>
        </div>

        <div class="footer-note">POWERED BY <b>ERIIC × ANURAG</b> • V7</div>
    </div>

    <a class="wa-btn" href="https://wa.me/916394812128?text=Hi%20Anurag%2C%20I%20need%20help%20with%20the%20V7%20Token%20Generator" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-1 1.1-.2.2-.4.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.8-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.6c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.3c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
        WhatsApp
    </a>

    <script>
        let currentSessionId = '';

        function setMsg(html, cls='') {
            const msg = document.getElementById('message');
            msg.className = cls;
            msg.innerHTML = html;
        }

        function setLoading(btn, text) {
            btn.disabled = true;
            btn.dataset.old = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span>' + text;
        }
        function resetBtn(btn) {
            btn.disabled = false;
            if (btn.dataset.old) btn.innerHTML = btn.dataset.old;
        }

        function showError(text, code) {
            const msg = document.getElementById('message');
            msg.className = '';
            let codeHtml = '';
            if (code) codeHtml = `<div class="error-code">CODE: ${code}</div>`;
            msg.innerHTML = `<div class="error-block"><span class="x">✕</span><div><div>${text}</div>${codeHtml}</div></div>`;
        }

        async function handleLogin() {
            const uid = document.getElementById('uid').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            document.getElementById('result').classList.add('hidden');

            if (!uid || !password) {
                showError('Email aur Password dono required hain');
                return;
            }

            setMsg('<span class="spinner"></span>Attempting login...');
            setLoading(btn, 'CONNECTING...');

            const formData = new FormData();
            formData.append('uid', uid);
            formData.append('password', password);

            try {
                const response = await fetch('/login', { method: 'POST', body: formData });
                const data = await response.json();
                resetBtn(btn);

                // ✅ Backend 2FA response
                if (data.two_factor) {
                    currentSessionId = data.session_id;
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('2fa-form').classList.remove('hidden');
                    setMsg('');
                }
                // ✅ Backend success response
                else if (data.success && data.token) {
                    showSuccess(data.token);
                }
                // ✅ Backend error response (both {error} and {success:false, error})
                else if (data.error) {
                    showError(data.error, data.error_code);
                }
                else {
                    showError('Unexpected response from server');
                }
            } catch (e) {
                resetBtn(btn);
                showError('Network error — server se connection nahi hua');
            }
        }

        async function handle2FA() {
            const otp = document.getElementById('otp').value.trim();
            const btn = document.getElementById('otp-btn');
            if (!otp) {
                showError('OTP code required');
                return;
            }

            setMsg('<span class="spinner"></span>Verifying code...');
            setLoading(btn, 'VERIFYING...');

            const formData = new FormData();
            formData.append('session_id', currentSessionId);
            formData.append('otp', otp);

            try {
                const response = await fetch('/two_factor', { method: 'POST', body: formData });
                const data = await response.json();
                resetBtn(btn);

                if (data.success && data.token) {
                    showSuccess(data.token);
                } else if (data.error) {
                    showError(data.error, data.error_code);
                } else {
                    showError('Unexpected response from server');
                }
            } catch (e) {
                resetBtn(btn);
                showError('Network error — 2FA verify nahi hua');
            }
        }

        function showSuccess(token) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('2fa-form').classList.add('hidden');
            document.getElementById('message').innerHTML = '';
            document.getElementById('message').className = '';

            const res = document.getElementById('result');
            res.classList.remove('hidden');
            res.style.animation = 'none';
            void res.offsetWidth;
            res.style.animation = '';

            const box = document.getElementById('token-display');
            box.style.animation = 'none';
            void box.offsetWidth;
            box.style.animation = '';
            box.textContent = token;
        }

        function copyToken(e) {
            const txt = document.getElementById('token-display').textContent;
            navigator.clipboard.writeText(txt).then(() => {
                const btn = e.target;
                const old = btn.textContent;
                btn.textContent = '✅ COPIED!';
                setTimeout(() => btn.textContent = old, 1500);
            });
        }

        document.getElementById('password')?.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        document.getElementById('otp')?.addEventListener('keydown', e => { if (e.key === 'Enter') handle2FA(); });
    </script>
</body>
</html>
