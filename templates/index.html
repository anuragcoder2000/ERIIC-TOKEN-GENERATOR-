<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ERIIC + ANURAG MISHRA V7</title>
<style>
    /* Aapka puraane wala White Theme CSS yahan aayega. 
       Main abhi chhota version de raha hoon taaki code clean rahe. */
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h1 { color: #1a1a2e; font-size: 1.2rem; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    .btn { width: 100%; padding: 14px; background: #00b894; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
    .btn:hover { background: #00a082; }
    .btn:disabled { background: #999; cursor: not-allowed; }
    
    /* Status Box */
    .status-box { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; text-align: left; }
    .status-text { font-weight: bold; color: #4b5563; margin-bottom: 5px; display: flex; align-items: center; gap: 10px;}
    .spinner { width: 16px; height: 16px; border: 2px solid #cbd5e1; border-top-color: #00b894; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .token-box { margin-top: 15px; background: #f0fdf9; padding: 15px; border-radius: 10px; border: 1px dashed #00b894; word-break: break-all; font-family: monospace; font-size: 0.8rem; color: #047857; text-align: left; }
    
    /* OTP Input Box (Hidden by default) */
    #otp-section { display: none; margin-top: 15px; padding: 15px; background: #fff3cd; border: 1px solid #ffecb5; border-radius: 10px;}
    #otp-section p { color: #856404; font-size: 0.85rem; margin: 0 0 10px 0; }
    
    .error { color: #e11d48; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>
    <div class="container">
        <h1>ERIIC + ANURAG MISHRA V7</h1>
        
        <div id="login-form">
            <input type="text" id="uid" placeholder="Email / User ID">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" id="login-btn" onclick="startSelenium()">⚡ LOGIN & GET TOKEN</button>
        </div>

        <!-- Live Status Area -->
        <div id="status-area" style="display: none;">
            <div class="status-box">
                <div class="status-text">
                    <div class="spinner" id="status-spinner"></div>
                    <span id="status-msg">Connecting...</span>
                </div>
            </div>

            <!-- 2FA / OTP Input (Shows up if FB asks for code) -->
            <div id="otp-section">
                <p><strong>⚠️ 2FA Required:</strong> Check your phone for SMS/Auth Code, or approve the notification.</p>
                <input type="text" id="otp-input" placeholder="Enter 6-digit code" style="margin-bottom: 10px;">
                <button class="btn" onclick="submitOTP()" style="background: #d97706;">VERIFY CODE</button>
            </div>

            <!-- Token Result -->
            <div id="token-result" class="token-box" style="display: none;">
                <strong>✅ Token Generated:</strong><br>
                <span id="token-text"></span>
            </div>
            
            <div id="error-msg" class="error"></div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let pollInterval = null;

        async function startSelenium() {
            const uid = document.getElementById('uid').value.trim();
            const password = document.getElementById('password').value;
            
            if(!uid || !password) return alert('Enter credentials');

            document.getElementById('login-form').style.display = 'none';
            document.getElementById('status-area').style.display = 'block';
            document.getElementById('status-msg').innerText = 'Starting secure browser...';

            const fd = new FormData();
            fd.append('uid', uid);
            fd.append('password', password);

            try {
                const res = await fetch('/start_selenium', { method: 'POST', body: fd });
                const data = await res.json();
                
                if(data.success) {
                    currentSessionId = data.session_id;
                    startPolling();
                } else {
                    showError(data.error);
                }
            } catch(e) {
                showError('Network error');
            }
        }

        function startPolling() {
            if(pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/check_status/${currentSessionId}`);
                    const data = await res.json();
                    
                    if(data.status === 'initializing' || data.status === 'starting') {
                        document.getElementById('status-msg').innerText = 'Logging in...';
                    } 
                    else if(data.status === 'waiting_2fa') {
                        document.getElementById('status-msg').innerText = 'Waiting for 2FA approval...';
                        document.getElementById('otp-section').style.display = 'block'; // Show OTP box
                    } 
                    else if(data.status === 'extracting') {
                        document.getElementById('status-msg').innerText = 'Extracting Token...';
                    }
                    else if(data.status === 'success') {
                        clearInterval(pollInterval);
                        document.getElementById('status-msg').innerText = 'Login Successful!';
                        document.getElementById('status-spinner').style.display = 'none';
                        document.getElementById('otp-section').style.display = 'none';
                        
                        const tokenBox = document.getElementById('token-result');
                        tokenBox.style.display = 'block';
                        document.getElementById('token-text').innerText = data.token;
                    }
                    else if(data.status === 'error') {
                        clearInterval(pollInterval);
                        showError(data.message || 'Unknown error');
                    }
                } catch(e) { console.log(e); }
            }, 3000); // Check every 3 seconds
        }

        async function submitOTP() {
            const otp = document.getElementById('otp-input').value.trim();
            if(!otp) return alert('Enter code');
            
            const fd = new FormData();
            fd.append('otp', otp);
            
            try {
                const res = await fetch(`/submit_otp/${currentSessionId}`, { method: 'POST', body: fd });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('status-msg').innerText = 'Verifying code...';
                    document.getElementById('otp-section').style.display = 'none';
                }
            } catch(e) { alert('Error submitting OTP'); }
        }

        function showError(msg) {
            document.getElementById('status-spinner').style.display = 'none';
            document.getElementById('error-msg').innerText = '❌ ' + msg;
            document.getElementById('login-form').style.display = 'block';
        }
    </script>
</body>
</html>
